<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4846ff" />
    <meta
      name="description"
      content="A little challenge. A lot to learn. Test your React knowledge with ten thoughtful questions and a detailed review."
    />
    <title>QuizApp · React Basics</title>
    <script>
      try {
        const theme = localStorage.getItem('quiz-theme');
        document.documentElement.dataset.theme =
          theme === 'dark' || theme === 'light'
            ? theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {
        /* The theme hook handles unavailable storage. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
