<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4846ff" />
    <meta
      name="description"
      content="Testez vos connaissances sur React avec dix questions et un corrigé détaillé. Votre progression est enregistrée automatiquement."
    />
    <title>QuizApp · Les bases de React</title>
    <script>
      try {
        const theme = localStorage.getItem('quiz-theme');
        document.documentElement.dataset.theme =
          theme === 'dark' || theme === 'light'
            ? theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {
        /* Le hook de thème gère les erreurs de stockage. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
